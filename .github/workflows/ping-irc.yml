# Reusable Ping-IRC job: consumers call it with the joined needs results,
# e.g. uses: tim-janik/release-kit/.github/workflows/ping-irc.yml@trunk
#      with: { jobs: "${{ join(needs.*.result, ' ') }}" }
# No secrets are needed; the GITHUB_TOKEN default (contents: read) suffices.

name: Ping-IRC

on:
  workflow_call:
    inputs:
      jobs:                # e.g. join(needs.*.result) of the caller
        required: true
        type: string
      server:
        default: irc.libera.chat:6697
        type: string
      channel:
        default: '#Anklang'
        type: string

jobs:
  Ping-IRC:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # job.workflow_* identifies this reusable workflow's own source;
        # github.action_ref would resolve to actions/checkout's ref instead.
        repository: ${{ job.workflow_repository || 'tim-janik/release-kit' }}
        ref: ${{ job.workflow_sha || 'trunk' }}  # match the caller's pin
        persist-credentials: false
    - name: Ping-IRC
      continue-on-error: true
      if: ${{ !env.ACT }}
      env:                                        # IRCBOT_JOBS indicates 'success'
        IRCBOT_JOBS: ${{ inputs.jobs }}
      run: ./ircbot.py -s "${{ inputs.server }}" -G "${{ inputs.channel }}"
