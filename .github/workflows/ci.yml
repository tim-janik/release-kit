# Lint: xclip -sel c < .github/workflows/ci.yml   # https://rhysd.github.io/actionlint/

name: CI

on:
  push: { branches: [ trunk ] }
  pull_request: { branches: [ trunk ] }

permissions: { contents: read }

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
    - { uses: actions/checkout@v7 }
    - run: python3 test_ircbot.py
    - run: bash release-test.sh
    - run: bash release-helper-test.sh
    - run: shellcheck --severity=error -- *.sh
    - name: Actionlint
      run: |
        mkdir -p tmp
        curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash | bash -s -- 1.7.12 tmp
        # actionlint 1.7.12 lacks the documented job.workflow_* properties (rhysd/actionlint#667)
        tmp/actionlint -color -ignore 'property "workflow_(sha|repository)" is not defined'
